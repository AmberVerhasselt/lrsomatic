---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "vepplugin_alphamissense_index"
description: Tabix-index the published AlphaMissense score file for the VEP AlphaMissense plugin
keywords:
  - vep
  - alphamissense
  - tabix
  - annotation
  - pathogenicity
tools:
  - "htslib":
      description: "C library for high-throughput sequencing data formats"
      homepage: "http://www.htslib.org/"
      documentation: "http://www.htslib.org/doc/tabix.html"
      tool_dev_url: "https://github.com/samtools/htslib"
      doi: "10.1093/gigascience/giab007"
      licence: ["MIT"]
      identifier: biotools:htslib

input:
  - - tsv:
        type: file
        description: |
          AlphaMissense score file as published, which ships without an index.
          The number of leading comment and header lines has varied between
          releases, so the script counts them rather than assuming.
        pattern: "*.tsv.gz"

output:
  tbi:
    - "*.tbi":
        type: file
        description: Tabix index for the score file
        pattern: "*.tbi"
  versions_tabix:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tabix:
          type: string
          description: The tool name
      - "tabix -h 2>&1 | grep -oP 'Version:\\s*\\K[^\\s]+'":
          type: string
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tabix:
          type: string
          description: The tool name
      - "tabix -h 2>&1 | grep -oP 'Version:\\s*\\K[^\\s]+'":
          type: string
          description: The command used to generate the version of the tool

authors:
  - "@AmberVerhasselt"
maintainers:
  - "@AmberVerhasselt"
